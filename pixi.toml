[workspace]
name = "diffusion-models-enso"
version = "0.1.0"
description = "Project to assess the ENSO variability using generative diffusion models"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = "3.11.*"
numpy = "*"
pandas = "*"
xarray = "*"
scikit-learn = "*"
matplotlib = "*"
cartopy = "*"
libnetcdf = "*"
gdal = "*"
pydantic-settings = "*"
xskillscore = "*"
notebook = "*"
ipykernel = "*"
scipy = "*"
pillow = "*"
tqdm = "*"
eofs = "*"
pytest = "*"
black = "*"
isort = "*"
mypy = "*"
marimo = ">=0.20.4,<0.21"
netcdf4 = ">=1.7.4,<2"
h5netcdf = ">=1.8.1,<2"
pip = ">=26.0.1,<27"
typer = ">=0.24.0,<0.25"

[tasks]
test = "pytest"
format = "black src scripts tests && isort src scripts tests"
typecheck = "mypy src scripts"
notebook = "jupyter notebook"

[environments]
enso = []
